name: Upload file to Google Drive

on:
  workflow_dispatch:
    inputs:
      hash:
        description: "Magnet-ссылка или URL файла. Оставьте пустым для теста."
        required: false
        default: ""
      filter:
        description: "Фильтр файлов (например, 'S01' или 'E01'). Если пусто — качаем всё."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_OAUTH_CREDENTIALS }}
      INPUT_HASH: ${{ inputs.hash }}
      INPUT_FILTER: ${{ inputs.filter }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 python3-pip
          pip3 install --user google-api-python-client google-auth google-auth-oauthlib

      - name: Download and Upload in parallel
        run: |
          mkdir -p download
          
          echo "Проверка места на Google Drive..."
          python3 scripts/upload_to_gdrive.py --check-space
          
          echo "Свободное место на локальном диске:"
          df -h /
          
          # 1. Запускаем загрузчик-пылесос
          echo "Запуск загрузчика-пылесоса..."
          python3 scripts/upload_to_gdrive.py --watch &
          UPLOAD_PID=$!
          
          # 2. Начинаем скачивание
          if [ -z "${INPUT_HASH}" ]; then
            echo "Dry run: скачиваем тестовый файл"
            curl -L \
              -o download/test_file.png \
              https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png
          else
            echo "Downloading: ${INPUT_HASH}"
            
            SELECT_ARG=""
            if [ -n "${INPUT_FILTER}" ]; then
              echo "Применяем фильтр: ${INPUT_FILTER}"
              # Сначала получаем список файлов (может занять время для магнитов)
              # Используем таймаут и сохранение метаданных если это магнит
              aria2c --show-files=true --bt-metadata-only=true --bt-save-metadata=true "${INPUT_HASH}" > file_list.txt || true
              
              # Парсим индексы файлов, соответствующих фильтру
              # Строки выглядят как: " 1|./path/to/file (100MB)"
              INDICES=$(grep -i "${INPUT_FILTER}" file_list.txt | awk -F'|' '{print $1}' | tr -d ' ' | paste -sd "," -)
              
              if [ -z "${INDICES}" ]; then
                echo "Файлы по фильтру '${INPUT_FILTER}' не найдены. Качаем всё."
              else
                echo "Выбраны файлы с индексами: ${INDICES}"
                SELECT_ARG="--select-file=${INDICES}"
              fi
            fi

            # --file-allocation=none критичен, чтобы не переполнить диск пустыми файлами
            aria2c --seed-time=0 \
                   --dir=download \
                   --file-allocation=none \
                   --summary-interval=60 \
                   ${SELECT_ARG} \
                   "${INPUT_HASH}"
          fi
          
          echo "Скачивание завершено. Проверка остатков..."
          sleep 30
          kill $UPLOAD_PID || true
          
          # Финальный проход на случай если что-то осталось
          python3 scripts/upload_to_gdrive.py
          
          echo "Свободное место на диске после завершения:"
          df -h /
